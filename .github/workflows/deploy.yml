name: Build and deploy static site

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Locate Chrome for browser tests
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome || true)"
          if [[ -z "$chrome_path" ]]; then
            chrome_path="$(command -v google-chrome-stable || command -v chromium || true)"
          fi
          if [[ -z "$chrome_path" ]]; then
            echo "Chrome executable not found on the runner" >&2
            exit 1
          fi
          echo "CHROME_PATH=${chrome_path}" >> "$GITHUB_ENV"
      - name: Test
        run: npm test
      - name: Validate archive
        run: npm run validate
      - name: Build static site
        run: npm run build

      - name: Publish static files to main
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publish_dir="$(mktemp -d)"
          trap 'git worktree remove --force "$publish_dir"' EXIT

          if git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
            git fetch origin main
            git worktree add --detach "$publish_dir" origin/main
          else
            git worktree add --detach "$publish_dir" HEAD
            git -C "$publish_dir" switch --orphan main
          fi

          git -C "$publish_dir" rm -r --ignore-unmatch .
          cp -R dist/. "$publish_dir"/
          git -C "$publish_dir" add -A

          if git -C "$publish_dir" diff --cached --quiet; then
            echo "main already matches this build"
          else
            git -C "$publish_dir" commit -m "deploy: ${SOURCE_SHA}"
            git -C "$publish_dir" push origin HEAD:main
          fi

      - name: Request GitHub Pages build from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
